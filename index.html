<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<title>Russisch 2000</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f2f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
main{max-width:620px;margin:auto;min-height:100vh;padding:18px 16px 28px;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;font-weight:750;font-size:18px}.counter{color:#777;font-size:13px;font-weight:500}
.stats{display:flex;gap:8px;margin:12px 0}.stat{flex:1;background:#fff;border-radius:14px;padding:9px;text-align:center;font-size:12px;color:#777}.stat b{display:block;color:#111;font-size:16px;margin-top:2px}
progress{width:100%;height:5px;margin:8px 0 18px;accent-color:#111}
.card{background:#fff;border-radius:28px;min-height:430px;padding:30px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 10px 30px #00000012;text-align:center;cursor:pointer}
.ru{font-size:50px;font-weight:750;letter-spacing:-1px}.roman{font-size:18px;color:#777;margin-top:8px}.de{font-size:28px;font-weight:650;margin-top:14px}.pos{font-size:12px;color:#999;margin-top:7px;text-transform:capitalize}
.example{border-top:1px solid #eee;margin-top:25px;padding-top:19px;font-size:16px;line-height:1.45;color:#444}.example small{display:block;color:#888;margin-top:7px}.conj{margin-top:15px;padding-top:14px;border-top:1px solid #eee;text-align:left;font-size:14px;line-height:1.55;color:#555}.conj b{color:#111}
.speak{margin-top:23px;width:54px;height:54px;border-radius:50%;border:1px solid #ddd;background:#fff;font-size:22px;cursor:pointer}
.hint{text-align:center;color:#888;font-size:13px;margin:16px 0}.actions{display:flex;gap:10px}.actions button{flex:1;padding:15px;border-radius:16px;font-size:16px;font-weight:650;border:1px solid #ddd;background:#fff;cursor:pointer}.actions .yes{background:#111;color:#fff;border-color:#111}.actions .no{color:#b00020}
.hidden{visibility:hidden}.footer{text-align:center;color:#aaa;font-size:11px;margin-top:15px}
</style>
</head>
<body><main>
<header><span>🇷🇺 Russisch</span><span class="counter" id="counter"></span></header>
<div class="stats"><div class="stat">Heute<b id="today">0</b></div><div class="stat">Lernblock<b id="block">0 / 50</b></div><div class="stat">Fällig<b id="due">0</b></div></div>
<progress id="progress" value="0" max="20"></progress>
<section class="card" id="card">
<div class="ru" id="ru">Lade Wörter…</div><div class="roman" id="roman"></div><div class="de" id="de"></div><div class="pos" id="pos"></div>
<div class="example" id="example"></div><button class="speak" id="speak" aria-label="Aussprache">🔊</button>
</section>
<div class="hint" id="hint">Tippen auf die Karte, um die Antwort zu sehen</div>
<div class="actions hidden" id="actions"><button class="no" id="no">✕ Nochmal</button><button class="yes" id="yes">✓ Gewusst</button></div>
<div class="footer">50er-Lernblöcke · Schwierige Wörter kommen häufiger · Spaced Repetition</div>
</main>
<script>
const LIMIT=2000, DAILY=20, BLOCK_SIZE=50, RETRY_GAP=3, REVIEW_GAPS=[100,200,400,800,1600,3200];
let words=[],queue=[],qIndex=0,revealed=false;
const $=id=>document.getElementById(id);
const state=JSON.parse(localStorage.getItem("ruSrs")||"{}");
function save(){localStorage.setItem("ruSrs",JSON.stringify(state))}
function todayKey(){return new Date().toISOString().slice(0,10)}
function clean(s){return (s||"").trim().toLowerCase()}
function presentConjugation(v){
 v=v.trim().toLowerCase();
 const special={
  "быть":["я есть","ты есть","он/она есть","мы есть","вы есть","они есть"],
  "идти":["я иду","ты идёшь","он/она идёт","мы идём","вы идёте","они идут"],
  "ехать":["я еду","ты едешь","он/она едет","мы едем","вы едете","они едут"],
  "есть":["я ем","ты ешь","он/она ест","мы едим","вы едите","они едят"],
  "хотеть":["я хочу","ты хочешь","он/она хочет","мы хотим","вы хотите","они хотят"],
  "мочь":["я могу","ты можешь","он/она может","мы можем","вы можете","они могут"],
  "говорить":["я говорю","ты говоришь","он/она говорит","мы говорим","вы говорите","они говорят"],
  "любить":["я люблю","ты любишь","он/она любит","мы любим","вы любите","они любят"],
  "смотреть":["я смотрю","ты смотришь","он/она смотрит","мы смотрим","вы смотрите","они смотрят"],
  "писать":["я пишу","ты пишешь","он/она пишет","мы пишем","вы пишете","они пишут"],
  "читать":["я читаю","ты читаешь","он/она читает","мы читаем","вы читаете","они читают"],
  "делать":["я делаю","ты делаешь","он/она делает","мы делаем","вы делаете","они делают"],
  "знать":["я знаю","ты знаешь","он/она знает","мы знаем","вы знаете","они знают"],
  "жить":["я живу","ты живёшь","он/она живёт","мы живём","вы живёте","они живут"],
  "пить":["я пью","ты пьёшь","он/она пьёт","мы пьём","вы пьёте","они пьют"],
  "говорить":["я говорю","ты говоришь","он/она говорит","мы говорим","вы говорите","они говорят"],
  "видеть":["я вижу","ты видишь","он/она видит","мы видим","вы видите","они видят"],
  "понимать":["я понимаю","ты понимаешь","он/она понимает","мы понимаем","вы понимаете","они понимают"],
  "понимать":["я понимаю","ты понимаешь","он/она понимает","мы понимаем","вы понимаете","они понимают"],
  "учить":["я учу","ты учишь","он/она учит","мы учим","вы учите","они учат"],
  "учиться":["я учусь","ты учишься","он/она учится","мы учимся","вы учитесь","они учатся"],
  "работать":["я работаю","ты работаешь","он/она работает","мы работаем","вы работаете","они работают"],
  "звонить":["я звоню","ты звонишь","он/она звонит","мы звоним","вы звоните","они звонят"],
  "купить":["я куплю","ты купишь","он/она купит","мы купим","вы купите","они купят"],
  "говорить":["я говорю","ты говоришь","он/она говорит","мы говорим","вы говорите","они говорят"],
  "сказать":["я скажу","ты скажешь","он/она скажет","мы скажем","вы скажете","они скажут"]
 };
 if(special[v])return special[v];
 if(!/ть$/.test(v))return null;
 let stem=v.slice(0,-2), second=/ить$/.test(v)||/еть$/.test(v)&&/видеть|смотреть|сидеть|лететь|терпеть|зависеть/.test(v);
 if(second){
   let base=stem;
   return ["я "+base+"ю","ты "+base+"ишь","он/она "+base+"ит","мы "+base+"им","вы "+base+"ите","они "+base+"ят"];
 }
 return ["я "+stem+"ю","ты "+stem+"ешь","он/она "+stem+"ет","мы "+stem+"ем","вы "+stem+"ете","они "+stem+"ют"];
}
function transliterate(s){
 const m={"а":"a","б":"b","в":"v","г":"g","д":"d","е":"ye","ё":"yo","ж":"zh","з":"z","и":"i","й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f","х":"kh","ц":"ts","ч":"ch","ш":"sh","щ":"shch","ъ":"","ы":"y","ь":"","э":"e","ю":"yu","я":"ya"};
 return [...s.toLowerCase()].map(ch=>m[ch]??ch).join("");
}
function totalAnswers(){return state._total||0}
function ensureV2(){
 if(state._v2)return;
 state._v2=1; state._total=0; state._graduated=0; state._nextNew=1; state._active=[];
 for(const w of words){
   const old=state[w.id];
   if(old){
     if((old.level||0)>0) state[w.id]={stage:2,reviewLevel:Math.min(old.level||1,REVIEW_GAPS.length),reviewAt:100,last:old.last||0,wrong:0};
     else state[w.id]={stage:0,active:true,availableAt:0,wrong:0};
     state._nextNew=Math.max(state._nextNew,w.id+1);
   }
 }
 fillActive();save();
}
function fillActive(){
 const active=state._active||[];
 for(const w of words){if(active.length>=BLOCK_SIZE)break;if(state[w.id]?.active&&!active.includes(w.id))active.push(w.id);}
 let i=Math.max(1,state._nextNew||1);
 while(active.length<BLOCK_SIZE&&i<=words.length){if(!state[i]){state[i]={stage:0,active:true,availableAt:totalAnswers()};active.push(i)}i++}
 state._nextNew=Math.max(state._nextNew||1,i);state._active=active;
}
function blockProgress(){return (state._graduated||0)%BLOCK_SIZE}
function getDue(){
 const due=[];for(const w of words){const s=state[w.id];if(s&&(s.active&&(s.availableAt||0)<=totalAnswers()||(s.stage===2&&(s.reviewAt||0)<=totalAnswers())))due.push(w)}return due;
}
function prepareQueue(){
 fillActive();const due=getDue();const activeDue=due.filter(w=>state[w.id]?.active);const reviews=due.filter(w=>state[w.id]?.stage===2);
 activeDue.sort((a,b)=>{const sa=state[a.id],sb=state[b.id];const pa=(sa.wrong||0)*100000-(sa.availableAt||0);const pb=(sb.wrong||0)*100000-(sb.availableAt||0);return pb-pa;});reviews.sort((a,b)=>(state[a.id].reviewAt||0)-(state[b.id].reviewAt||0));
 queue=[...activeDue,...reviews].slice(0,DAILY);
 if(queue.length<DAILY){const rest=state._active.map(id=>words.find(w=>w.id===id)).filter(Boolean).filter(w=>!queue.includes(w));rest.sort(()=>Math.random()-.5);queue.push(...rest.slice(0,DAILY-queue.length))}
 qIndex=0;render();
}
function render(){
 const w=queue[qIndex];
 if(!w){$("ru").textContent="Fertig 🎉";$("de").textContent="";return}
 revealed=false;
 $("ru").textContent=w.russian;$("roman").textContent="";$("de").textContent="";$("pos").textContent="";
 $("example").textContent="";$("actions").classList.add("hidden");$("hint").textContent="Tippen auf die Karte, um die Antwort zu sehen";
 $("counter").textContent=(qIndex+1)+" / "+queue.length;$("progress").max=queue.length;$("progress").value=qIndex;
 $("today").textContent=state._today===todayKey()?(state._count||0):0;
 $("learned").textContent=Object.keys(state).filter(k=>k!=="_today"&&state[k]?.level>0).length;
 $("due").textContent=getDue().length;
}
function reveal(){
 if(revealed||!queue[qIndex])return;
 const w=queue[qIndex];revealed=true;
 $("roman").textContent="("+w.romanization+")";$("de").textContent=w.german;$("pos").textContent=w.pos||"";
 $("example").innerHTML=w.example+"<small>"+(w.exampleGerman||"Beispielsatz")+"</small>";
 const c=presentConjugation(w.russian); $("conj").innerHTML=c?"<b>Präsens</b><br>"+c.map(x=>x).join("<br>"):""; $("conj").style.display=c?"block":"none";
 $("actions").classList.remove("hidden");$("hint").textContent="";
}
function speak(t){
 if("speechSynthesis"in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ru-RU";u.rate=.72;speechSynthesis.speak(u)}
}
function answer(known){
 const w=queue[qIndex],s=state[w.id]||{stage:0,active:true,availableAt:totalAnswers()};
 state._total=totalAnswers()+1;s.last=Date.now();
 if(known){
   if(s.stage<2){s.stage=(s.stage||0)+1;if(s.stage>=2){s.stage=2;s.active=false;s.reviewLevel=1;s.reviewAt=totalAnswers()+REVIEW_GAPS[0];state._active=state._active.filter(id=>id!==w.id);state._graduated=(state._graduated||0)+1;fillActive()}else{s.active=true;s.availableAt=totalAnswers()+5}}
   else{s.reviewLevel=Math.min((s.reviewLevel||1)+1,REVIEW_GAPS.length);s.reviewAt=totalAnswers()+(REVIEW_GAPS[(s.reviewLevel||1)-1]||3200)}
 }else{s.wrong=(s.wrong||0)+1;s.stage=0;s.active=true;s.availableAt=totalAnswers()+Math.max(1,Math.min(3,4-s.wrong));if(!state._active.includes(w.id))state._active.push(w.id)}
 state[w.id]=s;state._today=todayKey();state._count=(state._count||0)+1;fillActive();save();
 qIndex++;if(qIndex>=queue.length)prepareQueue();else render();
}
$("card").onclick=()=>reveal();$("speak").onclick=e=>{e.stopPropagation();if(queue[qIndex])speak(queue[qIndex].russian)};
$("no").onclick=()=>answer(false);$("yes").onclick=()=>answer(true);
fetch("words.json").then(r=>r.json()).then(d=>{
 words=d.slice(0,LIMIT).map((w,i)=>({
   id:w.id||i+1,
   russian:w.russian,
   romanization:w.romanization||transliterate(w.russian),
   german:w.german,
   pos:w.pos||"",
   example:w.example||"",
   exampleGerman:w.exampleGerman||""
 }));
 prepareQueue();
}).catch(()=>{$("ru").textContent="Fehler beim Laden";$("de").textContent="Bitte words.json prüfen."});
</script></body></html>
